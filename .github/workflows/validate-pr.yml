name: Validate PR – only languages folder allowed

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужен полный доступ к истории для сравнения

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            languages/**
          files_ignore: |
            **/*.md
            .github/**

      - name: List all changed files
        run: |
          echo "Changed files:"
          git diff --name-only origin/${{ github.base_ref }}...HEAD

      - name: Fail if changes outside languages/
        if: steps.changed-files.outputs.any_changed == 'false'
        run: |
          echo "❌ Pull Request содержит изменения за пределами папки languages/."
          echo "Разрешается изменять только файлы внутри languages/ (например, uk.xml, es.xml)."
          echo "Пожалуйста, отредактируйте PR и оставьте только изменения переводов."
          exit 1

      - name: Success
        if: steps.changed-files.outputs.any_changed == 'true'
        run: echo "✅ Все изменения находятся в папке languages/. PR может быть рассмотрен."
